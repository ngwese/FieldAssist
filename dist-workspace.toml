[workspace]
members = ["cargo:."]
# Only ship the desktop app and CLI tools (overrides publish = false).
packages = ["FieldAssist", "field-batch", "field-play"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Trigger releases via workflow_dispatch (build first; GitHub Release creates the tag)
dispatch-releases = true
# Cheap PR check only (not full multi-OS artifact builds)
pr-run-mode = "plan"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Cost-efficient native GitHub runners only
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# GPUI / X11 build deps on Ubuntu runners
[dist.dependencies]
apt = {
    libfontconfig-dev = "*",
    libxcb1-dev = "*",
    "libxkbcommon-dev" = "*",
    "libxkbcommon-x11-dev" = "*",
}
