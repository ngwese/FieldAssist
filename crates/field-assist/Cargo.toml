[package]
name = "FieldAssist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Review, edit, and process audio coming in from the field"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
schemars = { workspace = true }
gpui-kit = { workspace = true }
symphonia = { workspace = true }
cpal = { workspace = true }
mlua = { workspace = true }
hound = { workspace = true }
rusty_vorbis = { workspace = true }
ogg = { workspace = true }
flacenc = { workspace = true }
rubato = { workspace = true }
field-core = { path = "../field-core" }
field-audio-model = { path = "../field-audio-model" }
field-audio-io = { path = "../field-audio-io" }
field-audio-process = { path = "../field-audio-process" }
field-audio-monitor = { path = "../field-audio-monitor" }
field-audio-playback = { path = "../field-audio-playback" }
field-composition = { path = "../field-composition" }
field-session = { path = "../field-session" }
field-scripting = { path = "../field-scripting" }
field-ui-components = { path = "../field-ui-components" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSBezierPath",
    "NSColor",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "block2",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSData",
    "NSGeometry",
    "NSNotification",
    "NSString",
    "NSURL",
    "NSAppleEventManager",
    "NSAppleEventDescriptor",
    "objc2-core-foundation",
    "objc2-core-services",
] }

[build-dependencies]
embed-resource = { workspace = true }
