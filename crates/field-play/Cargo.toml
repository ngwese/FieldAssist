[package]
name = "field-play"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Example CLI: play a composition through the default audio device"
publish = false

[[bin]]
name = "field-play"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
cpal = { workspace = true }
field-audio-monitor = { path = "../field-audio-monitor" }
field-audio-playback = { path = "../field-audio-playback" }
field-composition = { path = "../field-composition" }
field-scripting = { path = "../field-scripting" }

[dev-dependencies]
tempfile = "3"
