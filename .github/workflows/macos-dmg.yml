#
# Pack and sign a FieldAssist DMG after cargo-dist finishes a Release
# workflow run. Dry-runs upload a workflow artifact; published tags also
# attach the DMG (and public .cer) to the GitHub Release.

name: macOS DMG

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  pack:
    name: pack-and-sign
    # Release PRs only run `dist plan` (no macOS archives). Pack after a
    # workflow_dispatch dry-run or promote.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'workflow_dispatch' }}
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch tip; pin to the
          # commit that produced the Release artifacts.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Require signing secrets
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [ -z "${MACOS_SIGNING_P12}" ]; then
            echo "::error::MACOS_SIGNING_P12 secret is not set"
            exit 1
          fi
          if [ -z "${MACOS_SIGNING_PASSWORD}" ]; then
            echo "::error::MACOS_SIGNING_PASSWORD secret is not set (must be non-empty)"
            exit 1
          fi

      - name: Download Release workflow artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist-artifacts
          merge-multiple: true

      - name: Locate macOS binaries
        id: bins
        run: |
          set -euo pipefail
          root="$(pwd)"
          search="${root}/dist-artifacts"
          names=(
            "FieldAssist-aarch64-apple-darwin.tar.gz"
            "field-play-aarch64-apple-darwin.tar.gz"
            "field-batch-aarch64-apple-darwin.tar.gz"
          )
          bin_dir="${root}/dmg-bins"
          mkdir -p "${bin_dir}"

          for name in "${names[@]}"; do
            archive="$(find "${search}" -type f -name "${name}" | head -n 1 || true)"
            if [ -z "${archive}" ]; then
              echo "::error::missing Release artifact: ${name} under ${search}"
              exit 1
            fi
            echo "Extracting ${archive}"
            tar -xzf "${archive}" -C "${bin_dir}"
          done

          for exe in FieldAssist field-play field-batch; do
            path="${bin_dir}/${exe}"
            if [ ! -x "${path}" ]; then
              found="$(find "${bin_dir}" -type f -name "${exe}" | head -n 1 || true)"
              if [ -z "${found}" ]; then
                echo "::error::missing ${exe} after extracting macOS archives"
                exit 1
              fi
              cp -f "${found}" "${path}"
              chmod +x "${path}"
            fi
          done

          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [ -z "${version}" ]; then
            echo "::error::could not read version from Cargo.toml"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "bin-dir=${bin_dir}" >> "${GITHUB_OUTPUT}"

      - name: Decode signing PKCS#12
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          p12_path="${RUNNER_TEMP}/FieldAssist.p12"
          printf '%s' "${MACOS_SIGNING_P12}" | base64 --decode > "${p12_path}"
          echo "FIELDASSIST_MACOS_SIGNING_P12=${p12_path}" >> "${GITHUB_ENV}"
          echo "FIELDASSIST_MACOS_SIGNING_PASSWORD=${MACOS_SIGNING_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Pack and sign DMG
        run: |
          set -euo pipefail
          version="${{ steps.bins.outputs.version }}"
          bin_dir="${{ steps.bins.outputs.bin-dir }}"
          out_dir="$(pwd)/dmg-out"
          mkdir -p "${out_dir}"
          out="${out_dir}/FieldAssist-${version}.dmg"
          ./script/bundle-macos \
            --skip-build \
            --bin-dir "${bin_dir}" \
            --out "${out}"

          (
            cd "${out_dir}"
            shasum -a 256 "FieldAssist-${version}.dmg" | awk '{print $1 "  " $2}' \
              > "FieldAssist-${version}.dmg.sha256"
          )
          cp -f "crates/field-assist/assets/macos/FieldAssist.cer" \
            "${out_dir}/FieldAssist.cer"

      - name: Upload DMG workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: FieldAssist-dmg
          path: |
            dmg-out/FieldAssist-*.dmg
            dmg-out/FieldAssist-*.dmg.sha256
            dmg-out/FieldAssist.cer

      - name: Detect published release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MANIFEST=$(find dist-artifacts -name 'dist-manifest.json' -o -name '*-dist-manifest.json' | head -n 1 || true)
          TAG=""
          if [ -n "${MANIFEST}" ]; then
            echo "Reading tag from ${MANIFEST}"
            TAG=$(python3 -c "import json,sys; m=json.load(open(sys.argv[1])); print(m.get('announcement_tag') or m.get('tag') or '')" "${MANIFEST}" || true)
          fi
          if [ -z "${TAG}" ]; then
            # Fallback: head_branch of a promote run is often release/X.Y.Z
            HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
            if [[ "${HEAD_BRANCH}" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
              CANDIDATE="${BASH_REMATCH[1]}"
              if gh release view "${CANDIDATE}" >/dev/null 2>&1; then
                TAG="${CANDIDATE}"
              fi
            fi
          fi
          if [ -n "${TAG}" ] && gh release view "${TAG}" >/dev/null 2>&1; then
            echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
            echo "publishing=true" >> "${GITHUB_OUTPUT}"
            echo "Publishing DMG to GitHub Release ${TAG}"
          else
            echo "publishing=false" >> "${GITHUB_OUTPUT}"
            echo "No published GitHub Release for this run (dry-run or plan-only)"
          fi

      - name: Attach DMG to GitHub Release
        if: ${{ steps.release.outputs.publishing == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.bins.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" \
            "dmg-out/FieldAssist-${VERSION}.dmg" \
            "dmg-out/FieldAssist-${VERSION}.dmg.sha256" \
            "dmg-out/FieldAssist.cer" \
            --clobber

          NOTES=$(gh release view "${TAG}" --json body -q .body)
          BLURB=$(cat <<EOF

          ## macOS (DMG)

          Open the disk image and drag FieldAssist to Applications. The
          package is self-signed (not notarized): on first launch, use
          Open Anyway in System Settings → Privacy & Security, or trust
          \`FieldAssist.cer\` in Keychain Access.

          After installing, use **FieldAssist → Install CLI Tools** to
          place \`field-play\` and \`field-batch\` on \`/usr/local/bin\`
          (administrator password required once).
          EOF
          )
          if ! grep -q '## macOS (DMG)' <<<"${NOTES}"; then
            printf '%s\n%s\n' "${NOTES}" "${BLURB}" > "${RUNNER_TEMP}/notes.md"
            gh release edit "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi
