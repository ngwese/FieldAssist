#
# Pack a combined Linux release tarball after cargo-dist finishes a Release
# workflow run. Dry-runs upload a workflow artifact; published tags also
# attach the tarball (and .sha256) to the GitHub Release.

name: Linux tarball

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  pack:
    name: pack-tarball
    # Release PRs only run `dist plan` (no Linux archives). Pack after a
    # workflow_dispatch dry-run or promote.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch tip; pin to the
          # commit that produced the Release artifacts.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download Release workflow artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist-artifacts
          merge-multiple: true

      - name: Locate Linux binaries
        id: bins
        run: |
          set -euo pipefail
          root="$(pwd)"
          search="${root}/dist-artifacts"
          names=(
            "FieldAssist-x86_64-unknown-linux-gnu.tar.gz"
            "field-play-x86_64-unknown-linux-gnu.tar.gz"
            "field-batch-x86_64-unknown-linux-gnu.tar.gz"
          )
          bin_dir="${root}/linux-bins"
          mkdir -p "${bin_dir}"

          for name in "${names[@]}"; do
            archive="$(find "${search}" -type f -name "${name}" | head -n 1 || true)"
            if [ -z "${archive}" ]; then
              echo "::error::missing Release artifact: ${name} under ${search}"
              exit 1
            fi
            echo "Extracting ${archive}"
            tar -xzf "${archive}" -C "${bin_dir}"
          done

          for exe in FieldAssist field-play field-batch; do
            path="${bin_dir}/${exe}"
            if [ ! -x "${path}" ]; then
              found="$(find "${bin_dir}" -type f -name "${exe}" | head -n 1 || true)"
              if [ -z "${found}" ]; then
                echo "::error::missing ${exe} after extracting Linux archives"
                exit 1
              fi
              cp -f "${found}" "${path}"
              chmod +x "${path}"
            fi
          done

          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [ -z "${version}" ]; then
            echo "::error::could not read version from Cargo.toml"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "bin-dir=${bin_dir}" >> "${GITHUB_OUTPUT}"

      - name: Pack Linux tarball
        run: |
          set -euo pipefail
          version="${{ steps.bins.outputs.version }}"
          bin_dir="${{ steps.bins.outputs.bin-dir }}"
          out_dir="$(pwd)/linux-out"
          mkdir -p "${out_dir}"
          archive="FieldAssist-${version}-x86_64-linux.tar.gz"
          out="${out_dir}/${archive}"
          chmod +x script/bundle-linux script/install-linux
          ./script/bundle-linux \
            --skip-build \
            --bin-dir "${bin_dir}" \
            --arch x86_64 \
            --out "${out}"

          (
            cd "${out_dir}"
            sha256sum "${archive}" | awk '{print $1 "  " $2}' \
              > "${archive}.sha256"
          )

      - name: Upload Linux tarball workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: FieldAssist-linux
          path: |
            linux-out/FieldAssist-*-x86_64-linux.tar.gz
            linux-out/FieldAssist-*-x86_64-linux.tar.gz.sha256

      - name: Detect published release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MANIFEST=$(find dist-artifacts -name 'dist-manifest.json' -o -name '*-dist-manifest.json' | head -n 1 || true)
          TAG=""
          if [ -n "${MANIFEST}" ]; then
            echo "Reading tag from ${MANIFEST}"
            TAG=$(python3 -c "import json,sys; m=json.load(open(sys.argv[1])); print(m.get('announcement_tag') or m.get('tag') or '')" "${MANIFEST}" || true)
          fi
          if [ -z "${TAG}" ]; then
            # Fallback: head_branch of a promote run is often release/X.Y.Z
            HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
            if [[ "${HEAD_BRANCH}" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
              CANDIDATE="${BASH_REMATCH[1]}"
              if gh release view "${CANDIDATE}" >/dev/null 2>&1; then
                TAG="${CANDIDATE}"
              fi
            fi
          fi
          if [ -n "${TAG}" ] && gh release view "${TAG}" >/dev/null 2>&1; then
            echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
            echo "publishing=true" >> "${GITHUB_OUTPUT}"
            echo "Publishing Linux tarball to GitHub Release ${TAG}"
          else
            echo "publishing=false" >> "${GITHUB_OUTPUT}"
            echo "No published GitHub Release for this run (dry-run or plan-only)"
          fi

      - name: Attach Linux tarball to GitHub Release
        if: ${{ steps.release.outputs.publishing == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.bins.outputs.version }}
        run: |
          set -euo pipefail
          archive="FieldAssist-${VERSION}-x86_64-linux.tar.gz"
          gh release upload "${TAG}" \
            "linux-out/${archive}" \
            "linux-out/${archive}.sha256" \
            --clobber

          NOTES=$(gh release view "${TAG}" --json body -q .body)
          BLURB=$(cat <<EOF

          ## Linux (tarball)

          Download \`${archive}\`, then:

          \`\`\`bash
          tar -xzf ${archive}
          cd FieldAssist-${VERSION}-x86_64-linux
          sudo ./install.sh
          \`\`\`

          That installs \`FieldAssist\`, \`field-play\`, and \`field-batch\`
          into \`/usr/local/bin\`. Use \`./install.sh --prefix DIR\` (or
          \`PREFIX=DIR ./install.sh\`) for a custom prefix. The GUI needs a
          desktop session with the usual ALSA and X11 client libraries; the
          install script does not install packages.
          EOF
          )
          if ! grep -q '## Linux (tarball)' <<<"${NOTES}"; then
            printf '%s\n%s\n' "${NOTES}" "${BLURB}" > "${RUNNER_TEMP}/notes.md"
            gh release edit "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi
