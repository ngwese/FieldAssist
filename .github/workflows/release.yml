#
# Build platform install packages (MSIX, DMG, Linux tarball + .deb) and
# publish them to a GitHub Release. Dry-runs upload workflow artifacts
# only; a real tag creates the Release after all three packs succeed.

name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release Tag (use dry-run to build without publishing)
        required: true
        default: dry-run
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: windows-msix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        shell: bash
        env:
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if [ -z "${WINDOWS_SIGNING_PFX}" ]; then
            echo "::error::WINDOWS_SIGNING_PFX secret is not set"
            exit 1
          fi
          # Empty password is allowed for the self-signed PFX.

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Read workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [ -z "${version}" ]; then
            echo "::error::could not read version from Cargo.toml"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Decode signing PFX
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfxPath = Join-Path $env:RUNNER_TEMP "FieldAssist.pfx"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX)
          )
          "FIELDASSIST_SIGNING_PFX=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($null -ne $env:WINDOWS_SIGNING_PASSWORD) {
            "FIELDASSIST_SIGNING_PASSWORD=$($env:WINDOWS_SIGNING_PASSWORD)" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Pack and sign MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $outDir = Join-Path (Get-Location) "msix-out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $out = Join-Path $outDir "FieldAssist-$version.msix"
          & powershell -NoProfile -ExecutionPolicy Bypass -File script/bundle-windows.ps1 `
            --out $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $out).Hash.ToLowerInvariant()
          $hashFile = "$out.sha256"
          Set-Content -LiteralPath $hashFile -Value "$hash  $(Split-Path -Leaf $out)`n" -NoNewline
          Copy-Item -Force `
            -LiteralPath "crates/field-assist/assets/windows/FieldAssist.cer" `
            -Destination (Join-Path $outDir "FieldAssist-windows.cer")

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: FieldAssist-msix
          path: |
            msix-out/FieldAssist-*.msix
            msix-out/FieldAssist-*.msix.sha256
            msix-out/FieldAssist-windows.cer

  macos:
    name: macos-dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [ -z "${MACOS_SIGNING_P12}" ]; then
            echo "::error::MACOS_SIGNING_P12 secret is not set"
            exit 1
          fi
          if [ -z "${MACOS_SIGNING_PASSWORD}" ]; then
            echo "::error::MACOS_SIGNING_PASSWORD secret is not set (must be non-empty)"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Read workspace version
        id: version
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [ -z "${version}" ]; then
            echo "::error::could not read version from Cargo.toml"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Decode signing PKCS#12
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          p12_path="${RUNNER_TEMP}/FieldAssist.p12"
          printf '%s' "${MACOS_SIGNING_P12}" | base64 --decode > "${p12_path}"
          echo "FIELDASSIST_MACOS_SIGNING_P12=${p12_path}" >> "${GITHUB_ENV}"
          echo "FIELDASSIST_MACOS_SIGNING_PASSWORD=${MACOS_SIGNING_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Pack and sign DMG
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          out_dir="$(pwd)/dmg-out"
          mkdir -p "${out_dir}"
          out="${out_dir}/FieldAssist-${version}.dmg"
          ./script/bundle-macos --out "${out}"

          (
            cd "${out_dir}"
            shasum -a 256 "FieldAssist-${version}.dmg" | awk '{print $1 "  " $2}' \
              > "FieldAssist-${version}.dmg.sha256"
          )
          cp -f "crates/field-assist/assets/macos/FieldAssist.cer" \
            "${out_dir}/FieldAssist-macos.cer"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: FieldAssist-dmg
          path: |
            dmg-out/FieldAssist-*.dmg
            dmg-out/FieldAssist-*.dmg.sha256
            dmg-out/FieldAssist-macos.cer

  linux:
    name: linux-pack
    # Pin 24.04 so the shipped glibc baseline stays compatible with
    # Ubuntu 24.04, Ubuntu 26.04, and Debian stable (Trixie).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            libasound2-dev \
            libfontconfig-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Read workspace version
        id: version
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [ -z "${version}" ]; then
            echo "::error::could not read version from Cargo.toml"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Pack Linux tarball and .deb
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          out_dir="$(pwd)/linux-out"
          mkdir -p "${out_dir}"
          archive="FieldAssist-${version}-x86_64-linux.tar.gz"
          deb="FieldAssist-${version}-amd64.deb"
          chmod +x script/bundle-linux script/install-linux script/bundle-deb
          ./script/bundle-linux --arch x86_64 --out "${out_dir}/${archive}"
          ./script/bundle-deb \
            --skip-build \
            --bin-dir "${CARGO_TARGET_DIR:-target}/release" \
            --out "${out_dir}/${deb}"

          (
            cd "${out_dir}"
            sha256sum "${archive}" | awk '{print $1 "  " $2}' \
              > "${archive}.sha256"
            sha256sum "${deb}" | awk '{print $1 "  " $2}' \
              > "${deb}.sha256"
          )

          echo "=== dpkg-deb -I ${deb} ==="
          dpkg-deb -I "${out_dir}/${deb}"
          echo "=== dpkg-deb -c ${deb} (binaries) ==="
          dpkg-deb -c "${out_dir}/${deb}" | grep -E 'usr/bin/'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: FieldAssist-linux
          path: |
            linux-out/FieldAssist-*-x86_64-linux.tar.gz
            linux-out/FieldAssist-*-x86_64-linux.tar.gz.sha256
            linux-out/FieldAssist-*-amd64.deb
            linux-out/FieldAssist-*-amd64.deb.sha256

  publish:
    name: publish
    needs: [windows, macos, linux]
    if: ${{ inputs.tag != 'dry-run' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download pack artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: FieldAssist-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify workspace version matches tag
        id: version
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [ -z "${version}" ]; then
            echo "::error::could not read version from Cargo.toml"
            exit 1
          fi
          if [ "${version}" != "${TAG}" ]; then
            echo "::error::Cargo.toml version (${version}) does not match release tag (${TAG})"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build release notes
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          notes="${RUNNER_TEMP}/notes.md"

          python3 - "${version}" CHANGELOG.md "${notes}" <<'PY'
          import pathlib, sys
          version, changelog_path, notes_path = sys.argv[1], sys.argv[2], sys.argv[3]
          text = pathlib.Path(changelog_path).read_text()
          marker = f"## [{version}]"
          start = text.find(marker)
          if start < 0:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          rest = text[start + len(marker):]
          next_heading = rest.find("\n## [")
          section = text[start:] if next_heading < 0 else text[start : start + len(marker) + next_heading]
          pathlib.Path(notes_path).write_text(section.rstrip() + "\n")
          PY

          cat >> "${notes}" <<EOF

          ## Windows (MSIX)

          Per-user install (one-time publisher trust needs an elevated
          PowerShell; package install/upgrade does not):

          \`\`\`powershell
          Import-Certificate -FilePath .\\FieldAssist-windows.cer \`
            -CertStoreLocation Cert:\\LocalMachine\\TrustedPeople
          Add-AppxPackage -Path .\\FieldAssist-${version}.msix
          \`\`\`

          Later upgrades: download the newer \`.msix\` and run
          \`Add-AppxPackage\` again (same certificate). Uninstall with
          \`Get-AppxPackage FieldAssist | Remove-AppxPackage\`.

          ## macOS (DMG)

          Open the disk image and drag FieldAssist to Applications. The
          package is self-signed (not notarized): on first launch, use
          Open Anyway in System Settings → Privacy & Security, or trust
          \`FieldAssist-macos.cer\` in Keychain Access.

          After installing, use **FieldAssist → Install CLI Tools** to
          place \`field-play\` and \`field-batch\` on \`/usr/local/bin\`
          (administrator password required once).

          ## Linux (.deb)

          Download \`FieldAssist-${version}-amd64.deb\`, then:

          \`\`\`bash
          sudo apt install ./FieldAssist-${version}-amd64.deb
          \`\`\`

          Or \`sudo dpkg -i FieldAssist-${version}-amd64.deb\`. That
          installs \`FieldAssist\`, \`field-play\`, and \`field-batch\`
          into \`/usr/bin\` and pulls in shared-library dependencies.
          Built on Ubuntu 24.04 for Ubuntu 24.04 / 26.04 and Debian
          stable (Trixie).

          ## Linux (tarball)

          Download \`FieldAssist-${version}-x86_64-linux.tar.gz\`, then:

          \`\`\`bash
          tar -xzf FieldAssist-${version}-x86_64-linux.tar.gz
          cd FieldAssist-${version}-x86_64-linux
          sudo ./install.sh
          \`\`\`

          That installs \`FieldAssist\`, \`field-play\`, and \`field-batch\`
          into \`/usr/local/bin\`. Use \`./install.sh --prefix DIR\` (or
          \`PREFIX=DIR ./install.sh\`) for a custom prefix. The GUI needs a
          desktop session with the usual ALSA and X11 client libraries; the
          install script does not install packages.
          EOF

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          prerelease_flag=""
          if [[ "${TAG}" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi

          shopt -s nullglob
          assets=(
            release-artifacts/FieldAssist-"${version}".msix
            release-artifacts/FieldAssist-"${version}".msix.sha256
            release-artifacts/FieldAssist-windows.cer
            release-artifacts/FieldAssist-"${version}".dmg
            release-artifacts/FieldAssist-"${version}".dmg.sha256
            release-artifacts/FieldAssist-macos.cer
            release-artifacts/FieldAssist-"${version}"-x86_64-linux.tar.gz
            release-artifacts/FieldAssist-"${version}"-x86_64-linux.tar.gz.sha256
            release-artifacts/FieldAssist-"${version}"-amd64.deb
            release-artifacts/FieldAssist-"${version}"-amd64.deb.sha256
          )
          for path in "${assets[@]}"; do
            if [ ! -f "${path}" ]; then
              echo "::error::missing release asset: ${path}"
              ls -la release-artifacts || true
              exit 1
            fi
          done

          gh release create "${TAG}" \
            --target "${{ github.sha }}" \
            --title "FieldAssist ${TAG}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            ${prerelease_flag} \
            "${assets[@]}"
