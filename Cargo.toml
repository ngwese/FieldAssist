[package]
name = "FieldAssist"
version = "0.4.0"
edition = "2021"
description = "Review, edit, and process audio coming in from the field"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
symphonia = { version = "0.6", features = ["all"] }
cpal = "0.18"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
hound = "3"
rusty_vorbis = "0.1"
ogg = "0.9"
flacenc = "0.5"
rubato = { version = "5", features = ["fft_resampler"] }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[build-dependencies]
embed-resource = "3"

[profile.dev.package]
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
