[workspace]
resolver = "2"
members = [
    "crates/field-assist",
    "crates/field-batch",
    "crates/field-scripting",
    "crates/field-core",
    "crates/field-features",
    "crates/field-audio-model",
    "crates/field-audio-io",
    "crates/field-audio-process",
    "crates/field-audio-monitor",
    "crates/field-audio-playback",
    "crates/field-composition",
    "crates/field-session",
    "crates/field-ui-components",
    "crates/field-play",
]
default-members = ["crates/field-assist"]

[workspace.package]
version = "0.12.0-pre"
edition = "2021"
license = "MIT"
repository = "https://github.com/ngwese/FieldAssist"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
blake3 = "1"
schemars = "1.0"
gpui-kit = "0.6.1"
symphonia = { version = "0.6", features = ["all"] }
cpal = "0.18"
arc-swap = "1"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
hound = "3"
rusty_vorbis = "0.1"
ogg = "0.9"
flacenc = "0.5"
rubato = { version = "5", features = ["fft_resampler"] }
realfft = "3"
dasp = { version = "0.11", features = ["std", "slice", "envelope", "envelope-peak"] }
thiserror = "2"
url = "2"
image = { version = "0.25", default-features = false }
embed-resource = "3"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
